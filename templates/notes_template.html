<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }} — {{ subtitle }}</title>
<style>
{% include 'notes.css' %}
</style>
</head>
<body>

<div class="title-block">
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>

</div>

{{ notes_body | safe }}

{% if pyqs_body %}

{{ pyqs_body | safe }}
{% endif %}

</body>
</html>
